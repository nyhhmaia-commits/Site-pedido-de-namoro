<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um pedido especial ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<div class="marca-dagua">
    <span>feito pela nynyyyy</span>
    <span>te amo doug</span>
</div>

<body>

    <main class="container" id="telaPedido">

        <img src="imagens/foto-inicio.jpg" alt="Nossa foto" class="foto-casal">

        <div class="heart">❤️</div>

        <h1>Quer sair comigo?</h1>

        <p>
            Eu tenho uma pergunta muito importante para você...
        </p>

        <div class="botoes">
            <button id="btnSim">SIM ❤️</button>
            <button id="btnNao">NÃO 😢</button>
        </div>

    </main>

    <main class="tela-especial" id="telaEspecial">

        <div class="coracoes">
            ❤️ 💕 ❤️ 💕 ❤️
        </div>

        <img src="imagens/foto-sim.jpg" alt="❤️" class="foto-especial">

        <h1>SIM! ❤️</h1>

        <h2>Agora nós vamos! 🥰</h2>

        <p class="mensagem-amor">
            prometo te entreter com boas risadas e caipirinhas, beijão amorecooooo
        </p>

        <div class="linha-coracoes">
            💕 ❤️ 💕 ❤️ 💕
        </div>

        <div class="mensagem-final">
            <p>
                Espero que esse seja apenas o começo
                da nossa história. ❤️
            </p>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
